<!doctype html>
<!--
  FILE: history.html = ORDER HISTORY. Lists every order placed, with status, lead time and expandable lines.
  Reads: orders, order_lines, inventory_records. Writes: order_lines (edit), deletes via bindDel in app.js.
  Part of the Order Tracker. Loads: supabase-js (CDN), config.js, app.js, then the script below.
  Dates are approximate: P1 planning ~Nov 16-17 2026, P2 first app ~Nov 17, P3 fixes from QA testing ~Nov 17-19, P4 page split, popups, receipt page ~Nov 19-20. See README 'How dates are given'.
  Read README.md first and CODE_MAP.md to find any function.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order history · Order Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
/* ---------- Order history ---------- */
/*
 * You asked for an order history [P3]. Filters: search, supplier, status, plus Reset filters (QA test 15.9).
 * Click a row to open its lines. Pencil = edit a line, trash = delete the whole order (with a popup).
 */
async function historyPage(){
  $("#app").innerHTML=I("Every order placed. Click an order to see its lines, costs and deliveries.")+`<div class="bar"><input id="hq" placeholder="Search order number"><select id="hs"><option value="">All suppliers</option>${opt(S.sup,"supplier_id","name")}</select><select id="hst"><option value="">Any status</option><option>Not received</option><option>Partly received</option><option>Received</option></select><button id="hrs">Reset filters</button><button id="hx" class="noprint">Export to Excel</button></div><div id="hl">Loading…</div>`;
  // Orders newest first, limited to 500. Lines come embedded (orders -> order_lines is a real database link).
  const od=await Q(sb.from("orders").select("order_id,order_number,supplier_id,site_id,order_date,order_lines(sku_id,quantity_ordered,unit_price,unit_freight,unit_duty,unit_other,landed_unit_cost,line_spend)").order("order_date",{ascending:false}).limit(500))||[];
  const ids=od.map(o=>o.order_id);
  // Deliveries are fetched SEPARATELY with .in(order_id, ids). WHY [P3-P4]: my fix-up prompt replaced the direct
  // link inventory_records -> orders with a link to order_lines, so embedding orders inside deliveries stopped
  // working ("Could not find a relationship" error). Two queries avoid depending on that link.
  const inv=ids.length?(await Q(sb.from("inventory_records").select("order_id,sku_id,arrival_date,quantity_received").in("order_id",ids))||[]):[];
  // R = received quantity per order+SKU; F = first arrival date per order (lead time = first arrival - order date,
  // matching the rule you chose for partial deliveries, Nov 17).
  const R={},F={};
  inv.forEach(r=>{const k=r.order_id+"|"+r.sku_id;R[k]=(R[k]||0)+ +r.quantity_received;if(!F[r.order_id]||r.arrival_date<F[r.order_id])F[r.order_id]=r.arrival_date});
  // Status: Received (all lines fully received), Partly received, Not received.
  const rows=od.map(o=>{
    const tot=o.order_lines.reduce((a,l)=>a+ +l.line_spend,0),got=o.order_lines.map(l=>R[o.order_id+"|"+l.sku_id]||0);
    const full=o.order_lines.length>0&&o.order_lines.every((l,i)=>got[i]>=+l.quantity_ordered);
    return{o,tot,got,st:full?"Received":got.some(x=>x>0)?"Partly received":"Not received",fa:F[o.order_id]}});
  const nm=(a,k,id,f)=>{const x=a.find(y=>y[k]==id);return x?x[f]:""};
  // EDIT A LINE [P3]: row becomes inputs. Rules: quantity > 0 and never below what was already received.
  // To fix a received amount, edit the delivery on site.html instead. Uses D() so a silently blocked update is reported.
  const bindEdit=()=>document.querySelectorAll(".ed").forEach(b=>b.onclick=e=>{
    e.stopPropagation();const oid=b.dataset.o,sid=b.dataset.s,tr=b.closest("tr");
    const o=od.find(x=>x.order_id==oid),l=o.order_lines.find(x=>x.sku_id==sid),got=R[oid+"|"+sid]||0;
    const inp=(c,val)=>`<td><input type="number" step="any" min="0" class="${c}" value="${val}" style="width:84px"></td>`;
    tr.innerHTML=`<td>${H(skuName(sid))}</td>${inp("e-q",l.quantity_ordered)}<td>${got}</td>${inp("e-p",l.unit_price)}${inp("e-f",l.unit_freight)}${inp("e-d",l.unit_duty)}${inp("e-o",l.unit_other)}<td colspan="2" class="m">Recalculated on save</td><td style="white-space:nowrap"><button class="pri" id="es">Save</button> <button id="ec">Cancel</button></td>`;
    tr.dataset.enter="#es";const g=c=>+tr.querySelector(c).value;
    tr.querySelector("#ec").onclick=e2=>{e2.stopPropagation();draw()};
    tr.querySelector("#es").onclick=async e2=>{e2.stopPropagation();const q=g(".e-q");
      if(!(q>0))return msg("Quantity must be more than 0.",1);
      if(q<got)return msg("Quantity cannot be less than the "+got+" already received.",1);
      const ok=await D(sb.from("order_lines").update({quantity_ordered:q,unit_price:g(".e-p"),unit_freight:g(".e-f"),unit_duty:g(".e-d"),unit_other:g(".e-o")}).eq("order_id",oid).eq("sku_id",sid),{chk:"Quantity must be more than 0 and costs cannot be negative."},"Nothing was changed. You may not have permission to edit this.");
      if(ok){msg("Line updated.");historyPage()}};
  });
  // Re-renders the table from the in-memory rows using the three filters. No new queries.
  /*
   * EXPORT TO EXCEL [P5, ~Nov 21 2026]: you asked for it on Order history.
   * WHAT: one spreadsheet row per ORDER LINE (not per order), because that is the shape Excel analysis needs: you can pivot by
   * supplier, SKU or month and sum the Line total. Numbers are real numbers (not text) so Excel can add them. It exports exactly the
   * rows currently shown, so use the filters first (search, supplier, status) to export a subset.
   * HOW: a real .xlsx file made in the browser with the SheetJS library (xlsx 0.18.5 from cdnjs, pinned; SOURCE https://sheetjs.com).
   * FALLBACK: if that library cannot load, a .csv file is saved instead. Excel opens both. The csv starts with a byte-order mark
   * so Excel reads accented characters correctly, and quotes any field containing a comma, quote or line break (RFC 4180).
   * Nothing is sent anywhere; the file is built in your browser from data already on screen.
   */
  let CUR=rows;   /* rows after the filters; draw() keeps this current */
  const exportRows=()=>{
    const out=[["Order number","Supplier","Site","Order date","SKU","Description","Quantity ordered","Unit price","Unit freight","Unit duty/tax","Unit other","Landed unit cost","Line total","Quantity received","First arrival date","Lead time (days)","Status"]];
    CUR.forEach(r=>r.o.order_lines.forEach((l,i)=>{const k=S.skus.find(s=>s.sku_id==l.sku_id)||{};
      out.push([r.o.order_number,nm(S.sup,"supplier_id",r.o.supplier_id,"name"),nm(S.sites,"site_id",r.o.site_id,"name"),r.o.order_date,k.sku_code||l.sku_id,k.description||"",+l.quantity_ordered,+l.unit_price,+l.unit_freight,+l.unit_duty,+l.unit_other,+l.landed_unit_cost,+l.line_spend,r.got[i],r.fa||"",r.fa?Math.round((new Date(r.fa)-new Date(r.o.order_date))/864e5):"",r.st])}));
    return out};
  const toCSV=a=>"\ufeff"+a.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n");
  const saveBlob=(blob,name)=>{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
  $("#hx").onclick=()=>{const a=exportRows();if(a.length<2)return msg("Nothing to export. Change the filters first.",1);
    const day=today();
    if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=a[0].map((h,i)=>({wch:Math.min(40,Math.max(String(h).length,...a.slice(1,60).map(r=>String(r[i]).length))+2)}));
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Order lines");XLSX.writeFile(wb,"order-history-"+day+".xlsx")}
    else saveBlob(new Blob([toCSV(a)],{type:"text/csv;charset=utf-8"}),"order-history-"+day+".csv");
    msg("Exported "+(a.length-1)+" order lines.")};
  const draw=()=>{
    const q=$("#hq").value.trim().toLowerCase(),su=$("#hs").value,st=$("#hst").value;
    const f=rows.filter(r=>(!q||String(r.o.order_number).toLowerCase().includes(q))&&(!su||r.o.supplier_id==su)&&(!st||r.st===st));
    CUR=f;
    $("#hl").innerHTML=f.length?`<div class="card" style="padding:0;overflow-x:auto"><table><tr><th>Order number</th><th>Supplier</th><th>Site</th><th>Order date</th><th>Total</th><th>Status</th><th>Lead time</th><th></th></tr>${f.map(r=>{
      const d=r.fa?Math.round((new Date(r.fa)-new Date(r.o.order_date))/864e5)+" days":"—";
      const ln=r.o.order_lines.map((l,i)=>`<tr><td>${H(skuName(l.sku_id))}</td><td>${l.quantity_ordered}</td><td>${r.got[i]}</td><td>${money(l.unit_price)}</td><td>${money(l.unit_freight)}</td><td>${money(l.unit_duty)}</td><td>${money(l.unit_other)}</td><td>${money(l.landed_unit_cost)}</td><td>${money(l.line_spend)}</td><td><button class="ed" data-o="${r.o.order_id}" data-s="${l.sku_id}" title="Edit line" aria-label="Edit line">${EDIT}</button></td></tr>`).join("");
      return`<tr class="hr" data-id="${r.o.order_id}" style="cursor:pointer"><td><b>${H(r.o.order_number)}</b></td><td>${H(nm(S.sup,"supplier_id",r.o.supplier_id,"name"))}</td><td>${H(nm(S.sites,"site_id",r.o.site_id,"name"))}</td><td>${r.o.order_date}</td><td>${money(r.tot)}</td><td>${r.st}</td><td>${d}</td><td><button class="xdel" data-k="order_id" data-i="${r.o.order_id}" data-n="order ${H(r.o.order_number)}" data-x="This also deletes its ${r.o.order_lines.length} line(s) and ${inv.filter(z=>z.order_id==r.o.order_id).length} delivery record(s). This cannot be undone." title="Delete order" aria-label="Delete order">${TRASH}</button></td></tr><tr id="d${r.o.order_id}" style="display:none"><td colspan="8" style="background:var(--bg)"><table><tr><th>SKU</th><th>Ordered</th><th>Received</th><th>Unit price</th><th>Freight</th><th>Duty/tax</th><th>Other</th><th>Landed cost</th><th>Line total</th><th></th></tr>${ln}</table></td></tr>`}).join("")}</table></div>`:'<p class="m">No orders match.</p>';
    document.querySelectorAll(".hr").forEach(t=>t.onclick=()=>{const x=$("#d"+t.dataset.id);x.style.display=x.style.display==="none"?"table-row":"none"});bindDel();bindEdit();
  };
  // Reset filters button (QA 15.9, Nov 19-20).
  $("#hrs").onclick=()=>{$("#hq").value="";$("#hs").value="";$("#hst").value="";draw()};
  $("#hq").oninput=draw;$("#hs").onchange=draw;$("#hst").onchange=draw;draw();
}
/*
 * Boot the page.
 */
start("history",historyPage);
</script>
</body>
</html>
