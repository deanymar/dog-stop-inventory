<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log order · Order Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
/* ---------- Log order ---------- */
function logPage(){
  S.lines=[];S.task=JSON.parse(sessionStorage.getItem("task")||"null");const t=S.task,hadTask=!!t;
  $("#app").innerHTML=I("Record an order you placed with a supplier. Enter the order details, add one line for each product, then save. Deliveries are recorded later on the site page.")+`<div class="card"><h2>Order</h2><div class="g" data-enter="#sv"><label>Order number (from supplier)<input id="on" value="${H(t?t.reference:"")}"></label><label>Supplier<select id="su"></select></label><label>Destination site<select id="si">${opt(S.sites,"site_id","name")}</select></label><label>Order date<input type="date" id="od" value="${today()}"></label></div><div id="ns" class="g" data-enter="#nsa" style="display:none;margin-top:10px"><label>New supplier name<input id="nsn"></label><div style="display:flex;align-items:flex-end"><button id="nsa" disabled>Add supplier</button></div></div></div>
  <div class="card"><h2>Lines</h2><div class="g" data-enter="#al"><label>SKU<select id="sk"></select></label><label>Quantity<input type="number" step="any" min="0" id="q"></label><label>Unit price<input type="number" step="any" min="0" id="p"></label><label>Unit freight<input type="number" step="any" min="0" id="fr" value="0"></label><label>Unit duty/tax<input type="number" step="any" min="0" id="du" value="0"></label><label>Unit other<input type="number" step="any" min="0" id="ot" value="0"></label></div>
  <div id="nk" class="g" data-enter="#nka" style="display:none;margin-top:10px"><label>New SKU code<input id="nkc"></label><label>Description<input id="nkd"></label><label>Unit of measure<select id="nku">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label><div style="display:flex;align-items:flex-end"><button id="nka" disabled>Add SKU</button></div></div>
  <p>Landed unit cost <b id="lc">$0.00</b> &nbsp; Line total <b id="lt">$0.00</b></p><button id="al">Add line</button><div id="ll" style="margin-top:10px"></div></div><button class="pri" id="sv">Save order</button>`;
  const rs=(id,arr,v,l,label,keep)=>{const el=$(id);el.innerHTML=opt(arr,v,l)+`<option value="__new">+ Add new ${label}…</option>`;if(keep)el.value=keep};
  const sw=()=>{$("#ns").style.display=$("#su").value==="__new"?"grid":"none";$("#nk").style.display=$("#sk").value==="__new"?"grid":"none"};
  const skl=k=>k.sku_code+" "+k.description;
  rs("#su",S.sup,"supplier_id","name","supplier");rs("#sk",S.skus,"sku_id",skl,"SKU");
  if(t){if(t.sku_id)$("#sk").value=t.sku_id;if(t.site_id)$("#si").value=t.site_id}
  $("#su").onchange=sw;$("#sk").onchange=sw;sw();
  const en=(ids,b)=>{const f=()=>{$(b).disabled=!ids.every(i=>$(i).value.trim())};ids.forEach(i=>$(i).oninput=f)};
  en(["#nsn"],"#nsa");en(["#nkc","#nkd"],"#nka");
  $("#nsa").onclick=async()=>{const n=$("#nsn").value.trim();const r=await Q(sb.from("suppliers").insert({name:n}).select().single(),{dup:n+" was already added."});
    if(r){S.sup.push(r);rs("#su",S.sup,"supplier_id","name","supplier",r.supplier_id);$("#nsn").value="";$("#nsa").disabled=true;sw();msg("Supplier added.")}};
  $("#nka").onclick=async()=>{const c=$("#nkc").value.trim(),d=$("#nkd").value.trim();const r=await Q(sb.from("skus").insert({sku_code:c,description:d,unit_of_measure:$("#nku").value}).select().single(),{dup:c+" was already added."});
    if(r){S.skus.push(r);rs("#sk",S.skus,"sku_id",skl,"SKU",r.sku_id);$("#nkc").value="";$("#nkd").value="";$("#nka").disabled=true;sw();msg("SKU added.")}};
  const v=i=>+$(i).value||0,calc=()=>{const c=v("#p")+v("#fr")+v("#du")+v("#ot");$("#lc").textContent=money(c);$("#lt").textContent=money(c*v("#q"))};
  ["#q","#p","#fr","#du","#ot"].forEach(i=>$(i).oninput=calc);
  const show=()=>{$("#ll").innerHTML=S.lines.length?`<table><tr><th>SKU</th><th>Qty</th><th>Landed cost</th><th>Total</th><th></th></tr>${S.lines.map((l,i)=>{const c=l.unit_price+l.unit_freight+l.unit_duty+l.unit_other;return`<tr><td>${H(skuName(l.sku_id))}</td><td>${l.quantity_ordered}</td><td>${money(c)}</td><td>${money(c*l.quantity_ordered)}</td><td style="white-space:nowrap"><button class="ed2" data-i="${i}" title="Edit line" aria-label="Edit line">${EDIT}</button><button class="del" data-i="${i}" title="Remove line" aria-label="Remove line">${TRASH}</button></td></tr>`}).join("")}</table>`:"";
    document.querySelectorAll(".ed2").forEach(b=>b.onclick=()=>{const l=S.lines[+b.dataset.i];S.lines.splice(+b.dataset.i,1);$("#sk").value=l.sku_id;sw();$("#q").value=l.quantity_ordered;$("#p").value=l.unit_price;$("#fr").value=l.unit_freight;$("#du").value=l.unit_duty;$("#ot").value=l.unit_other;calc();show();$("#q").focus()});
    document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(await ask("Are you sure you want to remove this line?","",{ok:"Remove"})){S.lines.splice(+b.dataset.i,1);show()}})};
  $("#al").onclick=()=>{
    if($("#sk").value==="__new"||!$("#sk").value)return msg("Choose a SKU, or add the new one first.",1);
    if(!(v("#q")>0)||$("#p").value==="")return msg("Enter a quantity and a unit price.",1);
    if(S.lines.some(l=>l.sku_id==$("#sk").value))return msg("That SKU is already on this order.",1);
    S.lines.push({sku_id:+$("#sk").value,quantity_ordered:v("#q"),unit_price:v("#p"),unit_freight:v("#fr"),unit_duty:v("#du"),unit_other:v("#ot")});
    $("#q").value="";$("#p").value="";calc();show();
  };
  $("#sv").onclick=async()=>{
    const nm=$("#on").value.trim();
    if(!nm)return msg("Enter the order number from the supplier.",1);
    if(!$("#su").value||$("#su").value==="__new")return msg("Choose a supplier, or add the new one first.",1);
    if(!$("#si").value)return msg("Choose a destination site. Add one on the Sites page first if there are none.",1);
    if(!S.lines.length)return msg("Add at least one line.",1);
    $("#sv").disabled=true;const o=await Q(sb.from("orders").insert({order_number:nm,supplier_id:+$("#su").value,site_id:+$("#si").value,order_date:$("#od").value}).select().single(),{dup:"Order "+nm+" already exists for this supplier."});
    if(!o){$("#sv").disabled=false;return}
    const l=await Q(sb.from("order_lines").insert(S.lines.map(x=>({...x,order_id:o.order_id}))).select(),{chk:"Quantity must be more than 0 and costs cannot be negative."});
    if(!l){await sb.from("orders").delete().eq("order_id",o.order_id);$("#sv").disabled=false;return}
    if(S.task){await Q(sb.from("pending_tasks").update({status:"done",completed_order_id:o.order_id,completed_at:new Date().toISOString()}).eq("task_id",S.task.task_id));S.task=null;sessionStorage.removeItem("task")}
    msg("Order saved.");if(hadTask)location.href="tasks.html";else{logPage();badge()}
  };
}
start("log",logPage);
</script>
</body>
</html>
