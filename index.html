<!doctype html>
<!--
  FILE: index.html = DASHBOARD (home page). Kept as index.html because GitHub Pages serves it at the site root (you asked for this).
  Shows: totals, orders-over-time charts, top 5 SKUs, weekly usage with the 3 heaviest weeks flagged, lead-time alerts.
  Part of the Order Tracker. Loads: supabase-js (CDN), config.js, app.js, then the script below.
  Dates are approximate: P1 planning ~Nov 16-17 2026, P2 first app ~Nov 17, P3 fixes from QA testing ~Nov 17-19, P4 page split, popups, receipt page ~Nov 19-20. See README 'How dates are given'.
  Read README.md first and CODE_MAP.md to find any function.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Order Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
/* ---------- Dashboard ---------- */
/*
 * Builds the filter bar and calls draw(). Default range = last 90 days [P2]. A test note: orders older than
 * 90 days will not show until the From date is moved back (QA Part 7 says so).
 */
function dash(){
  const f=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  $("#app").innerHTML=I("Your overview: what you ordered and spent, what was used, and which orders are running late. Change the filters and press Apply.")+`<div class="bar"><select id="fs"><option value="">All SKUs</option>${opt(S.skus,"sku_id","sku_code")}</select><input type="date" id="ff" value="${f}"><input type="date" id="ft" value="${today()}"><button class="pri" id="go">Apply</button></div><div id="d">Loading…</div>`;
  $("#go").onclick=draw;draw();
}
/*
 * Tiny SVG line chart written by hand. WHY no chart library [P2]: fewer files and no extra CDN to trust.
 * Labels print on points when there are 6 or fewer (a single month used to look like a lone dot) [P3].
 * The invisible big circle (class hit) is the hover target for the tooltip in app.js.
 */
function line(vals,labels,fmt){
  if(!vals.length)return'<p class="m">No orders in this range.</p>';
  const w=320,h=110,mx=Math.max(...vals)||1,x=i=>vals.length<2?w/2:10+i*(w-20)/(vals.length-1),y=v=>h-10-v/mx*(h-24);
  return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Line chart"><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${vals.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--a)"/><circle class="hit" data-t="${labels[i]}: ${fmt(v)}" cx="${x(i)}" cy="${y(v)}" r="12" fill="transparent"/>`).join("")}${vals.length<=6?vals.map((v,i)=>`<text x="${x(i)}" y="${y(v)-7}" text-anchor="middle" font-size="9" fill="currentColor">${fmt(v)}</text><text x="${x(i)}" y="${h-1}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${labels[i]}</text>`).join(""):""}</svg><div class="m">${labels[0]} to ${labels[labels.length-1]}. Highest: ${fmt(mx)}</div>`;
}
/*
 * draw() = read three things then compute everything in the browser:
 * 1) orders with their lines in the date range, 2) usage events of type "use", 3) the view v_lead_time_alerts.
 * WHY computed here, not in database functions [P2-P3]: the AI-built schema changed names, and browser code
 * is easier for you to change. COST: all rows are downloaded; fine for small volumes, revisit past ~10,000 orders.
 */
async function draw(){
  const sku=$("#fs").value,f=$("#ff").value,t=$("#ft").value;
  // Three queries run in parallel. The alerts view needs no date filter: an alert is true regardless of range.
  const r=await Promise.all([
    Q(sb.from("orders").select("order_date,order_lines(sku_id,quantity_ordered,line_spend)").gte("order_date",f).lte("order_date",t)),
    Q(sb.from("usage_events").select("sku_id,quantity_change,created_at").eq("event_type","use").gte("created_at",f).lte("created_at",t+"T23:59:59")),
    Q(sb.from("v_lead_time_alerts").select("*"))]);
  // Flatten orders -> lines, apply the SKU filter, then total by month (M) and by SKU (by).
  // Spend uses line_spend (generated column) so the browser never re-derives landed cost.
  const lines=(r[0]||[]).flatMap(o=>o.order_lines.map(l=>({...l,d:o.order_date}))).filter(l=>!sku||l.sku_id==sku);
  const M={},by={};
  lines.forEach(l=>{const k=l.d.slice(0,7);(M[k]=M[k]||{u:0,s:0});M[k].u+=+l.quantity_ordered;M[k].s+=+l.line_spend;(by[l.sku_id]=by[l.sku_id]||{u:0,s:0});by[l.sku_id].u+=+l.quantity_ordered;by[l.sku_id].s+=+l.line_spend});
  const ks=Object.keys(M).sort(),U=lines.reduce((a,l)=>a+ +l.quantity_ordered,0),SP=lines.reduce((a,l)=>a+ +l.line_spend,0);
  // Weekly usage: weeks start MONDAY (ISO 8601). Only event_type "use" counts (not waste/adjustments).
  // Quantities are stored negative, so usage = minus the sum. is-hot = top 3 weeks in the range [P3 decision].
  // USES created_at, NOT recorded_at: the AI-built column is created_at (error found Nov 17-19).
  const W={};
  (r[1]||[]).filter(e=>!sku||e.sku_id==sku).forEach(e=>{const d=new Date(e.created_at);d.setDate(d.getDate()-(d.getDay()+6)%7);const k=d.toISOString().slice(0,10);W[k]=(W[k]||0)-e.quantity_change});
  const wk=Object.keys(W).sort(),hot=wk.slice().sort((a,b)=>W[b]-W[a]).slice(0,3),wm=Math.max(...wk.map(k=>W[k]),1);
  const al=r[2]||[];let cols=al.length?Object.keys(al[0]).filter(c=>!/_id$/.test(c)):[];if(al.length&&!cols.length)cols=Object.keys(al[0]);
  const fv=(c,v)=>{if(v===null||v===undefined)return"";if(typeof v==="number"&&!Number.isInteger(v)||/^-?\d+\.\d{3,}$/.test(String(v)))return (+v).toFixed(1);if(c==="alert_status")return String(v).replace(/^./,x=>x.toUpperCase());return v};
  const hd=c=>c.replace(/_/g," ").replace(/^./,x=>x.toUpperCase());
  $("#d").innerHTML=`<div class="tiles"><div><span>Total spend</span><b>${money(SP)}</b></div><div><span>Units ordered</span><b>${U.toLocaleString()}</b></div><div><span>Avg landed cost</span><b>${U?money(SP/U):"—"}</b></div><div><span>Open alerts</span><b>${al.length}</b></div></div>
  <div class="two"><div class="card"><h2>Order units by month</h2>${line(ks.map(k=>M[k].u),ks,v=>v.toLocaleString())}</div><div class="card"><h2>Spend by month</h2>${line(ks.map(k=>M[k].s),ks,money)}</div></div>
  <div class="two"><div class="card"><div class="bar" style="margin:0 0 6px;justify-content:space-between"><h2 style="margin:0">Top 5 SKUs</h2><span><button id="bs">Spend</button> <button id="bu">Units</button></span></div><div id="top"></div></div>
  <div class="card"><h2>Weekly usage</h2>${wk.length?`<div class="wk">${wk.map(k=>`<div class="${hot.includes(k)?"hot":""}" style="height:${W[k]/wm*100}%" data-t="Week of ${k}: ${W[k]}"></div>`).join("")}</div><p class="m">Amber: the 3 heaviest weeks in this range. ${hot.map(k=>k+" ("+W[k]+")").join(", ")}</p>`:'<p class="m">No usage recorded in this range.</p>'}</div></div>
  <div class="card al"><div class="bar" style="margin:0 0 8px;justify-content:space-between;align-items:center"><h2 style="margin:0">Lead-time alerts</h2>${role==="admin"?'<span><button id="sl">Send to Slack</button> <button id="st">Send test message</button></span>':""}</div>${al.length?`<div style="overflow-x:auto"><table><tr>${cols.map(c=>`<th>${H(hd(c))}</th>`).join("")}</tr>${al.map(a=>`<tr>${cols.map(c=>`<td>${H(fv(c,a[c]))}</td>`).join("")}</tr>`).join("")}</table></div>`:'<p class="m">No late orders.</p>'}</div>`;
  // Top 5 SKUs, switchable between spend (s) and units (u). Drawn with plain divs for the bars.
  const top=m=>{const e=Object.entries(by).sort((a,b)=>b[1][m]-a[1][m]).slice(0,5),mx=e.length?e[0][1][m]:1;$("#top").innerHTML=e.length?e.map(x=>`<div class="row"><span>${H(skuName(x[0]))}</span><i style="width:${x[1][m]/mx*100}%"></i><b>${m==="s"?money(x[1].s):x[1].u.toLocaleString()}</b></div>`).join(""):'<p class="m">No orders in this range.</p>'};
  $("#bs").onclick=()=>top("s");$("#bu").onclick=()=>top("u");top("s");
  if(role==="admin"){usageCard();$("#sl").onclick=()=>slack(false);$("#st").onclick=()=>slack(true)}
}
/*
 * Boot the page.
 */
/*
 * slack(test): the SEND TO SLACK buttons (admins only). [P5, ~Nov 21 2026]
 * They call the Edge Function "send-alerts" (PROMPTS.md section G) with the signed-in admin's login. The function holds the Slack
 * bot token as a protected secret; the browser never sees it. "Send to Slack" posts every alert that has not been posted yet to
 * every active recipient and records each one in alert_notifications, so pressing it twice never posts twice.
 * "Send test message" posts one harmless line (body {test:true}) to prove the connection works.
 * The expected reply is {sent:number, failures:[{order_number, error}]} (PROMPTS.md section L asks the function for exactly that).
 * Anything else is shown as "Done." so an unexpected reply never looks like an error.
 */
async function slack(test){
  if(!await ask(test?"Send a test message to Slack?":"Send the current alerts to Slack?",test?"One short test message is posted to your Slack channel.":"Alerts that were already sent are skipped, so nothing is posted twice.",{ok:"Send",safe:true}))return;
  const b=$(test?"#st":"#sl");b.disabled=true;
  const{data,error}=await sb.functions.invoke("send-alerts",{body:test?{test:true}:{}});
  b.disabled=false;
  if(error){let m=error.message;try{const j=await error.context.json();m=j.error||JSON.stringify(j)}catch(e){}msg("Slack send failed: "+m,1);return}
  const f=(data&&data.failures)||[];
  if(f.length){await ask("Slack reported problems",f.slice(0,5).map(x=>(x.order_number||"message")+": "+(x.error||x.slack_error||JSON.stringify(x))).join("\n"),{info:true});return}
  const n=data&&Array.isArray(data.sent)?data.sent.length:(data&&typeof data.sent==="number"?data.sent:null);
  msg(test?"Test message sent to Slack.":(n===0?"Nothing new to send. Those alerts were already sent.":(n===null?"Done.":"Sent "+n+" alert"+(n===1?"":"s")+" to Slack.")));
}
/*
 * usageCard(): "Receipt scanner usage this month" (admins only). [P5, ~Nov 21 2026]
 * Counts prompts copied and receipts saved from ai_usage_log, plus the average items per receipt. Tokens and estimated cost show only
 * when rows carry them (API route, not built yet); with copy and paste they stay "-" because the app cannot see claude.ai usage.
 * If the table is not created yet the query errors and the card is simply not shown. Billing truth for the API, if used later, is the
 * Claude Console Usage and Cost pages (platform.claude.com/usage and /cost); this card is only a convenience view.
 */
async function usageCard(){
  const d=new Date(),m0=new Date(d.getFullYear(),d.getMonth(),1).toISOString();
  const r=await sb.from("ai_usage_log").select("event,items_count,input_tokens,output_tokens,cost_usd,created_at").gte("created_at",m0);
  if(r.error)return;
  const rows=r.data||[],pc=rows.filter(x=>x.event==="prompt_copied").length,sv=rows.filter(x=>x.event==="receipt_saved");
  const rs=await sb.from("receipt_scans").select("fields_changed,matched_total,matched_correct").gte("created_at",m0);   /* learning loop results, see scan.html */
  let extra="";
  if(!rs.error&&(rs.data||[]).length){const n=rs.data.length,fc=rs.data.reduce((a,x)=>a+(+x.fields_changed||0),0),mt=rs.data.reduce((a,x)=>a+(+x.matched_total||0),0),mc=rs.data.reduce((a,x)=>a+(+x.matched_correct||0),0);
    extra=`<div class="tiles" style="margin:10px 0 0"><div><span>Avg corrections per receipt</span><b>${(fc/n).toFixed(1)}</b></div><div><span>Items matched correctly</span><b>${mt?Math.round(mc/mt*100)+"%":"-"}</b></div></div>`}
  const items=sv.reduce((a,x)=>a+(+x.items_count||0),0),tok=rows.reduce((a,x)=>a+(+x.input_tokens||0)+(+x.output_tokens||0),0),cost=rows.reduce((a,x)=>a+(+x.cost_usd||0),0),api=rows.some(x=>x.cost_usd!=null);
  $("#d").insertAdjacentHTML("beforeend",`<div class="card" id="uc"><h2>Receipt scanner usage this month</h2><div class="tiles" style="margin:0"><div><span>Prompts copied</span><b>${pc}</b></div><div><span>Receipts saved</span><b>${sv.length}</b></div><div><span>Avg items per receipt</span><b>${sv.length?(items/sv.length).toFixed(1):"-"}</b></div><div><span>Tokens / est. cost</span><b>${api?tok.toLocaleString()+" / "+money(cost):"-"}</b></div></div>${extra}<p class="m">Tokens and cost appear only for receipts read through the Claude API. The copy-and-paste route runs on your own claude.ai plan, so the app cannot see its tokens.</p></div>`);
}
start("index",dash);
</script>
</body>
</html>
